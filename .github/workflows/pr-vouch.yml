name: PR Vouch

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  push:
    branches:
      - main
    paths:
      - .github/VOUCHED.td
      - .github/workflows/pr-vouch.yml
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  # Serialize PR events with full sweeps so stale runs cannot overwrite new trust decisions.
  # Keep pending sweeps and let active ones finish rather than leaving some PRs unchanged.
  group: pr-vouch
  cancel-in-progress: false
  queue: max

jobs:
  vouch:
    name: Label PR authors by trust
    runs-on: ubuntu-24.04
    steps:
      # Read the default branch so a PR cannot grant trust to its own author.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Apply vouch labels
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("node:fs");
            const { owner, repo } = context.repo;

            const managedLabelNames = ["vouch:trusted", "vouch:unvouched", "vouch:denounced"];

            const trusted = new Set();
            const denounced = new Set();
            const listPath = `${process.env.GITHUB_WORKSPACE}/.github/VOUCHED.td`;

            for (const raw of fs.readFileSync(listPath, "utf8").split("\n")) {
              const line = raw.trim();
              if (!line || line.startsWith("#")) continue;

              // Empty logins must not satisfy the zero-trusted check below.
              if (line.startsWith("-github:")) {
                const login = line.slice("-github:".length).split(/\s+/)[0].toLowerCase();
                if (login) denounced.add(login);
              } else if (line.startsWith("github:")) {
                const login = line.slice("github:".length).split(/\s+/)[0].toLowerCase();
                if (login) trusted.add(login);
              }
            }

            if (trusted.size === 0) {
              core.setFailed("VOUCHED.td parsed to zero trusted entries. Refusing to mark everyone unvouched.");
              return;
            }

            // Refuse missing definitions before addLabels can create grey, undescribed labels.
            const liveLabels = await github.paginate(github.rest.issues.listLabelsForRepo, {
              owner,
              repo,
              per_page: 100,
            });
            const liveNames = new Set(liveLabels.map((label) => label.name));
            const missing = managedLabelNames.filter((name) => !liveNames.has(name));
            if (missing.length) {
              core.setFailed(
                `Missing label definitions: ${missing.join(", ")}. Run the Labels workflow before this one.`,
              );
              return;
            }

            // Deleted accounts have no user object and count as unvouched.
            const targets =
              context.eventName === "pull_request_target"
                ? [{ number: context.payload.pull_request.number, user: context.payload.pull_request.user?.login ?? "" }]
                : (
                    await github.paginate(github.rest.pulls.list, { owner, repo, state: "open", per_page: 100 })
                  ).map((pull) => ({ number: pull.number, user: pull.user?.login ?? "" }));

            for (const target of targets) {
              const login = target.user.toLowerCase();
              const wanted = denounced.has(login)
                ? "vouch:denounced"
                : trusted.has(login)
                  ? "vouch:trusted"
                  : "vouch:unvouched";

              const current = (
                await github.paginate(github.rest.issues.listLabelsOnIssue, {
                  owner,
                  repo,
                  issue_number: target.number,
                  per_page: 100,
                })
              ).map((label) => label.name);

              for (const stale of managedLabelNames.filter((name) => name !== wanted && current.includes(name))) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: target.number, name: stale });
              }

              if (!current.includes(wanted)) {
                await github.rest.issues.addLabels({ owner, repo, issue_number: target.number, labels: [wanted] });
              }

              core.info(`#${target.number} by ${target.user}: ${wanted}`);
            }
