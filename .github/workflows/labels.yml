name: Labels

on:
  push:
    branches: [main]
    paths:
      - .github/labels.json
      - .github/VOUCHED.td
      - .github/workflows/labels.yml
  pull_request_target:
    types: [opened, reopened, edited, synchronize, ready_for_review, converted_to_draft]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Sync label definitions
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    concurrency:
      group: labels-sync
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Create or update every label in the manifest
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const manifest = require(`${process.env.GITHUB_WORKSPACE}/.github/labels.json`);
            const { owner, repo } = context.repo;
            const tooLong = manifest.filter((label) => (label.description ?? "").length > 100);
            const badColor = manifest.filter((label) => !/^[0-9a-fA-F]{6}$/.test(label.color ?? ""));
            const names = manifest.map((label) => label.name);
            const duplicates = names.filter((name, index) => names.indexOf(name) !== index);
            const nameSet = new Set(names);
            const badRename = manifest.filter((label) => label.renamedFrom && nameSet.has(label.renamedFrom));
            if (tooLong.length || badColor.length || duplicates.length || badRename.length) {
              core.setFailed(
                [
                  tooLong.length ? `Description over 100 chars: ${tooLong.map((label) => label.name).join(", ")}` : "",
                  badColor.length ? `Color is not 6 hex digits: ${badColor.map((label) => label.name).join(", ")}` : "",
                  duplicates.length ? `Duplicate name: ${[...new Set(duplicates)].join(", ")}` : "",
                  badRename.length ? `renamedFrom points at a live name: ${badRename.map((label) => label.name).join(", ")}` : "",
                ].filter(Boolean).join("; "),
              );
              return;
            }
            const getLabel = async (name) => {
              try {
                return (await github.rest.issues.getLabel({ owner, repo, name })).data;
              } catch (error) {
                if (error.status !== 404) throw error;
                return null;
              }
            };
            for (const label of manifest) {
              const existing = await getLabel(label.name);
              if (!existing && label.renamedFrom) {
                const previous = await getLabel(label.renamedFrom);
                if (previous) {
                  await github.rest.issues.updateLabel({ owner, repo, name: label.renamedFrom, new_name: label.name, color: label.color, description: label.description });
                  continue;
                }
              }
              if (!existing) {
                await github.rest.issues.createLabel({ owner, repo, name: label.name, color: label.color, description: label.description });
              } else if (existing.color.toLowerCase() !== label.color.toLowerCase() || (existing.description ?? "") !== label.description) {
                await github.rest.issues.updateLabel({ owner, repo, name: label.name, color: label.color, description: label.description });
              }
            }

  type-area:
    name: Label PR type and area
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: read
      pull-requests: write
    concurrency:
      group: labels-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      # Read the base repository so a pull request cannot change the label rules it runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Sync type and area labels
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const manifest = require(`${process.env.GITHUB_WORKSPACE}/.github/labels.json`);
            const managed = new Set(manifest.map((label) => label.name).filter((name) => name.startsWith("type:") || name.startsWith("area:")));
            const wanted = new Set();
            const match = /^([a-z]+)(?:\([^)]*\))?!?:/i.exec(pr.title.trim());
            if (match && managed.has(`type:${match[1].toLowerCase()}`)) wanted.add(`type:${match[1].toLowerCase()}`);
            const areaOf = (path) => {
              if (path.startsWith("app/")) return "area:app";
              if (path.startsWith("ai/")) return "area:ai";
              if (path.startsWith("engine/")) return "area:engine";
              if (path.startsWith("templates/")) return "area:templates";
              if (path.startsWith("packaging/")) return "area:packaging";
              if (path.startsWith("docs/") || (!path.includes("/") && path.toLowerCase().endsWith(".md"))) return "area:docs";
              if (path.startsWith(".github/") || path.startsWith("scripts/")) return "area:ci";
              return null;
            };
            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: pr.number, per_page: 100 });
            for (const file of files) {
              for (const path of [file.filename, file.previous_filename]) {
                const area = path ? areaOf(path) : null;
                if (area) wanted.add(area);
              }
            }
            const defined = new Set((await github.paginate(github.rest.issues.listLabelsForRepo, { owner, repo, per_page: 100 })).map((label) => label.name));
            const missing = [...wanted].filter((name) => !defined.has(name));
            if (missing.length) {
              core.setFailed(`${missing.join(", ")} not defined. Run the Labels workflow to sync .github/labels.json.`);
              return;
            }
            const { data: current } = await github.rest.issues.listLabelsOnIssue({ owner, repo, issue_number: pr.number, per_page: 100 });
            const partial = files.length < pr.changed_files;
            if (partial) core.warning(`Listed ${files.length} of ${pr.changed_files} files; keeping existing area labels.`);
            for (const label of current) {
              if (!managed.has(label.name) || wanted.has(label.name)) continue;
              if (partial && label.name.startsWith("area:")) continue;
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: pr.number, name: label.name });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
            const toAdd = [...wanted].filter((name) => !current.some((label) => label.name === name));
            if (toAdd.length) await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: toAdd });
            core.info(`PR #${pr.number}: ${[...wanted].join(", ") || "no type or area labels"}`);

  size:
    name: Label PR size
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: read
      pull-requests: write
    concurrency:
      group: labels-size-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      # Fetch the PR head only as Git data. Nothing from the PR is installed or executed.
      - name: Checkout base repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Sync PR size label
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { execFileSync } = require("node:child_process");
            const issueNumber = context.payload.pull_request.number;
            const baseSha = context.payload.pull_request.base.sha;
            const headSha = context.payload.pull_request.head.sha;
            const headTrackingRef = `refs/remotes/pr-size/${issueNumber}`;
            const manifest = require(`${process.env.GITHUB_WORKSPACE}/.github/labels.json`);
            const managedLabelNames = new Set(manifest.map((label) => label.name).filter((name) => name.startsWith("size:")));
            const testExcludePathspecs = [":(glob,exclude)**/test/**", ":(glob,exclude)**/tests/**", ":(glob,exclude)**/e2e/**", ":(glob,exclude)**/fixtures/**", ":(glob,exclude)**/*.test.*", ":(glob,exclude)**/*.spec.*", ":(glob,exclude)**/test_*.py"];
            const sumNumstat = (text) => text.split("\n").filter(Boolean).reduce((total, line) => {
              const [insertionsRaw = "0", deletionsRaw = "0"] = line.split("\t");
              const additions = insertionsRaw === "-" ? 0 : Number.parseInt(insertionsRaw, 10) || 0;
              const deletions = deletionsRaw === "-" ? 0 : Number.parseInt(deletionsRaw, 10) || 0;
              return total + additions + deletions;
            }, 0);
            const resolveSizeLabel = (totalChangedLines) => {
              if (totalChangedLines < 10) return "size:XS";
              if (totalChangedLines < 30) return "size:S";
              if (totalChangedLines < 100) return "size:M";
              if (totalChangedLines < 500) return "size:L";
              if (totalChangedLines < 1000) return "size:XL";
              return "size:XXL";
            };
            execFileSync("git", ["fetch", "--no-tags", "origin", baseSha], { stdio: "inherit" });
            execFileSync("git", ["fetch", "--no-tags", "origin", `+refs/pull/${issueNumber}/head:${headTrackingRef}`], { stdio: "inherit" });
            const resolvedHeadSha = execFileSync("git", ["rev-parse", headTrackingRef], { encoding: "utf8" }).trim();
            if (resolvedHeadSha !== headSha) core.warning(`Fetched head SHA ${resolvedHeadSha} does not match pull request head SHA ${headSha}.`);
            execFileSync("git", ["cat-file", "-e", `${baseSha}^{commit}`], { stdio: "inherit" });
            const diffArgs = ["diff", "--numstat", "--ignore-all-space", "--ignore-blank-lines", `${baseSha}...${resolvedHeadSha}`];
            const git = (args) => execFileSync("git", args, { encoding: "utf8", maxBuffer: 256 * 1024 * 1024 });
            const totalChangedLines = sumNumstat(git(diffArgs));
            const nonTestChangedLines = sumNumstat(git([...diffArgs, "--", ".", ...testExcludePathspecs]));
            const testChangedLines = Math.max(0, totalChangedLines - nonTestChangedLines);
            const changedLines = nonTestChangedLines === 0 ? testChangedLines : nonTestChangedLines;
            const nextLabelName = resolveSizeLabel(changedLines);
            const { data: currentLabels } = await github.rest.issues.listLabelsOnIssue({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber, per_page: 100 });
            const definedLabels = await github.paginate(github.rest.issues.listLabelsForRepo, { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 });
            if (!definedLabels.some((label) => label.name === nextLabelName)) {
              core.setFailed(`${nextLabelName} is not defined. Run the Labels workflow to sync .github/labels.json.`);
              return;
            }
            for (const label of currentLabels) {
              if (!managedLabelNames.has(label.name) || label.name === nextLabelName) continue;
              try {
                await github.rest.issues.removeLabel({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber, name: label.name });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
            if (!currentLabels.some((label) => label.name === nextLabelName)) await github.rest.issues.addLabels({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber, labels: [nextLabelName] });
            const classification = nonTestChangedLines === 0 ? (testChangedLines > 0 ? "test-only PR" : "no line changes") : (testChangedLines > 0 ? "test lines excluded" : "all non-test changes");
            core.info(`PR #${issueNumber}: ${nonTestChangedLines} non-test lines, ${testChangedLines} test lines, ${changedLines} effective lines -> ${nextLabelName} (${classification})`);

  vouch:
    name: Label PR authors by trust
    if: github.event_name == 'pull_request_target' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
      pull-requests: read
    concurrency:
      group: labels-vouch
      cancel-in-progress: false
    steps:
      # Read the default branch so a PR cannot grant trust to its own author.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Apply vouch labels
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require("node:fs");
            const { owner, repo } = context.repo;
            const managedLabelNames = ["vouch:trusted", "vouch:unvouched", "vouch:denounced"];
            const trusted = new Set();
            const denounced = new Set();
            for (const raw of fs.readFileSync(`${process.env.GITHUB_WORKSPACE}/.github/VOUCHED.td`, "utf8").split("\n")) {
              const line = raw.trim();
              if (!line || line.startsWith("#")) continue;
              if (line.startsWith("-github:")) {
                const login = line.slice("-github:".length).split(/\s+/)[0].toLowerCase();
                if (login) denounced.add(login);
              } else if (line.startsWith("github:")) {
                const login = line.slice("github:".length).split(/\s+/)[0].toLowerCase();
                if (login) trusted.add(login);
              }
            }
            if (trusted.size === 0) {
              core.setFailed("VOUCHED.td parsed to zero trusted entries. Refusing to mark everyone unvouched.");
              return;
            }
            const liveLabels = await github.paginate(github.rest.issues.listLabelsForRepo, { owner, repo, per_page: 100 });
            const missing = managedLabelNames.filter((name) => !liveLabels.some((label) => label.name === name));
            if (missing.length) {
              core.setFailed(`Missing label definitions: ${missing.join(", ")}. Run the Labels workflow to sync .github/labels.json.`);
              return;
            }
            const targets = context.eventName === "pull_request_target"
              ? [{ number: context.payload.pull_request.number, user: context.payload.pull_request.user?.login ?? "" }]
              : (await github.paginate(github.rest.pulls.list, { owner, repo, state: "open", per_page: 100 })).map((pull) => ({ number: pull.number, user: pull.user?.login ?? "" }));
            for (const target of targets) {
              const login = target.user.toLowerCase();
              const wanted = denounced.has(login) ? "vouch:denounced" : trusted.has(login) ? "vouch:trusted" : "vouch:unvouched";
              const current = (await github.paginate(github.rest.issues.listLabelsOnIssue, { owner, repo, issue_number: target.number, per_page: 100 })).map((label) => label.name);
              for (const stale of managedLabelNames.filter((name) => name !== wanted && current.includes(name))) await github.rest.issues.removeLabel({ owner, repo, issue_number: target.number, name: stale });
              if (!current.includes(wanted)) await github.rest.issues.addLabels({ owner, repo, issue_number: target.number, labels: [wanted] });
              core.info(`#${target.number} by ${target.user}: ${wanted}`);
            }
