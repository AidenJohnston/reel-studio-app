name: Labels

on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize, ready_for_review, converted_to_draft]
  issue_comment:
    types: [created]
  push:
    branches: [main]
    paths:
      - .github/labels.json
      - .github/VOUCHED.td
      - .github/workflows/labels.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  sync:
    name: Sync label definitions
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      issues: write
    concurrency:
      group: labels
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create or update every label in the manifest
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const manifest = require(`${process.env.GITHUB_WORKSPACE}/.github/labels.json`);
            const { owner, repo } = context.repo;
            const tooLong = manifest.filter((label) => (label.description ?? "").length > 100);
            const badColor = manifest.filter((label) => !/^[0-9a-fA-F]{6}$/.test(label.color ?? ""));
            const names = manifest.map((label) => label.name);
            const duplicates = names.filter((name, index) => names.indexOf(name) !== index);
            const nameSet = new Set(names);
            const badRename = manifest.filter((label) => label.renamedFrom && nameSet.has(label.renamedFrom));
            if (tooLong.length || badColor.length || duplicates.length || badRename.length) {
              core.setFailed(
                [
                  tooLong.length ? `Description over 100 chars: ${tooLong.map((label) => label.name).join(", ")}` : "",
                  badColor.length ? `Color is not 6 hex digits: ${badColor.map((label) => label.name).join(", ")}` : "",
                  duplicates.length ? `Duplicate name: ${[...new Set(duplicates)].join(", ")}` : "",
                  badRename.length ? `renamedFrom points at a live name: ${badRename.map((label) => label.name).join(", ")}` : "",
                ].filter(Boolean).join("; "),
              );
              return;
            }

            const getLabel = async (name) => {
              try {
                return (await github.rest.issues.getLabel({ owner, repo, name })).data;
              } catch (error) {
                if (error.status !== 404) throw error;
                return null;
              }
            };

            for (const label of manifest) {
              const existing = await getLabel(label.name);
              if (!existing && label.renamedFrom) {
                const previous = await getLabel(label.renamedFrom);
                if (previous) {
                  await github.rest.issues.updateLabel({
                    owner, repo, name: label.renamedFrom, new_name: label.name,
                    color: label.color, description: label.description,
                  });
                  continue;
                }
              }
              if (!existing) {
                await github.rest.issues.createLabel({ owner, repo, name: label.name, color: label.color, description: label.description });
              } else if (existing.color.toLowerCase() !== label.color.toLowerCase() || (existing.description ?? "") !== label.description) {
                await github.rest.issues.updateLabel({ owner, repo, name: label.name, color: label.color, description: label.description });
              }
            }

  type-area:
    name: Label PR type and area
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: read
      pull-requests: write
    concurrency:
      group: pr-labels-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      # Write token: read only the PR's title and file names, never its code.
      - name: Checkout base repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Sync type and area labels
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const manifest = require(`${process.env.GITHUB_WORKSPACE}/.github/labels.json`);
            const managed = new Set(
              manifest.map((label) => label.name).filter((name) => name.startsWith("type:") || name.startsWith("area:")),
            );

            const wanted = new Set();
            const match = /^([a-z]+)(?:\([^)]*\))?!?:/i.exec(pr.title.trim());
            if (match && managed.has(`type:${match[1].toLowerCase()}`)) wanted.add(`type:${match[1].toLowerCase()}`);

            const areaOf = (path) => {
              if (path.startsWith("app/")) return "area:app";
              if (path.startsWith("ai/")) return "area:ai";
              if (path.startsWith("engine/")) return "area:engine";
              if (path.startsWith("templates/")) return "area:templates";
              if (path.startsWith("packaging/")) return "area:packaging";
              if (path.startsWith("docs/") || !path.includes("/") && path.toLowerCase().endsWith(".md")) return "area:docs";
              if (path.startsWith(".github/") || path.startsWith("scripts/")) return "area:ci";
              return null;
            };
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: pr.number, per_page: 100,
            });
            for (const file of files) {
              for (const path of [file.filename, file.previous_filename]) {
                const area = path ? areaOf(path) : null;
                if (area) wanted.add(area);
              }
            }

            const defined = new Set(
              (await github.paginate(github.rest.issues.listLabelsForRepo, { owner, repo, per_page: 100 })).map((l) => l.name),
            );
            const missing = [...wanted].filter((name) => !defined.has(name));
            if (missing.length) {
              core.setFailed(`${missing.join(", ")} not defined. Run the Labels workflow to sync .github/labels.json.`);
              return;
            }

            const { data: current } = await github.rest.issues.listLabelsOnIssue({
              owner, repo, issue_number: pr.number, per_page: 100,
            });
            // The files API stops at 3,000; with a partial list, only add area labels.
            const partial = files.length < pr.changed_files;
            if (partial) core.warning(`Listed ${files.length} of ${pr.changed_files} files; keeping existing area labels.`);
            for (const label of current) {
              if (!managed.has(label.name) || wanted.has(label.name)) continue;
              if (partial && label.name.startsWith("area:")) continue;
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: pr.number, name: label.name });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
            const toAdd = [...wanted].filter((name) => !current.some((label) => label.name === name));
            if (toAdd.length) await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: toAdd });
            core.info(`PR #${pr.number}: ${[...wanted].join(", ") || "no type or area labels"}`);

  size:
    name: Label PR size
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: read
      pull-requests: write
    concurrency:
      group: pr-size-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      # Write token: fetch the PR head only as Git data, never run it.
      - name: Checkout base repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Sync PR size label
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { execFileSync } = require("node:child_process");

            const issueNumber = context.payload.pull_request.number;
            const baseSha = context.payload.pull_request.base.sha;
            const headSha = context.payload.pull_request.head.sha;
            const headTrackingRef = `refs/remotes/pr-size/${issueNumber}`;
            const manifest = require(`${process.env.GITHUB_WORKSPACE}/.github/labels.json`);
            const managedLabelNames = new Set(
              manifest.map((label) => label.name).filter((name) => name.startsWith("size:")),
            );
            const testExcludePathspecs = [
              ":(glob,exclude)**/test/**",
              ":(glob,exclude)**/tests/**",
              ":(glob,exclude)**/e2e/**",
              ":(glob,exclude)**/fixtures/**",
              ":(glob,exclude)**/*.test.*",
              ":(glob,exclude)**/*.spec.*",
              ":(glob,exclude)**/test_*.py",
            ];

            const sumNumstat = (text) =>
              text
                .split("\n")
                .filter(Boolean)
                .reduce((total, line) => {
                  const [insertionsRaw = "0", deletionsRaw = "0"] = line.split("\t");
                  const additions = insertionsRaw === "-" ? 0 : Number.parseInt(insertionsRaw, 10) || 0;
                  const deletions = deletionsRaw === "-" ? 0 : Number.parseInt(deletionsRaw, 10) || 0;
                  return total + additions + deletions;
                }, 0);

            const resolveSizeLabel = (totalChangedLines) => {
              if (totalChangedLines < 30) return "size:XS";
              if (totalChangedLines < 150) return "size:S";
              if (totalChangedLines < 500) return "size:M";
              if (totalChangedLines < 1500) return "size:L";
              if (totalChangedLines < 3000) return "size:XL";
              return "size:XXL";
            };

            execFileSync("git", ["fetch", "--no-tags", "origin", baseSha], { stdio: "inherit" });
            execFileSync(
              "git",
              ["fetch", "--no-tags", "origin", `+refs/pull/${issueNumber}/head:${headTrackingRef}`],
              { stdio: "inherit" },
            );

            const resolvedHeadSha = execFileSync("git", ["rev-parse", headTrackingRef], {
              encoding: "utf8",
            }).trim();
            if (resolvedHeadSha !== headSha) {
              core.warning(`Fetched head SHA ${resolvedHeadSha} does not match pull request head SHA ${headSha}.`);
            }

            execFileSync("git", ["cat-file", "-e", `${baseSha}^{commit}`], { stdio: "inherit" });
            const diffArgs = ["diff", "--numstat", "--ignore-all-space", "--ignore-blank-lines", `${baseSha}...${resolvedHeadSha}`];
            const git = (args) => execFileSync("git", args, { encoding: "utf8", maxBuffer: 256 * 1024 * 1024 });
            const totalChangedLines = sumNumstat(git(diffArgs));
            const nonTestChangedLines = sumNumstat(git([...diffArgs, "--", ".", ...testExcludePathspecs]));
            const testChangedLines = Math.max(0, totalChangedLines - nonTestChangedLines);
            // A test-only PR is sized by its test lines.
            const changedLines = nonTestChangedLines === 0 ? testChangedLines : nonTestChangedLines;
            const nextLabelName = resolveSizeLabel(changedLines);

            const { data: currentLabels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const definedLabels = await github.paginate(github.rest.issues.listLabelsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            if (!definedLabels.some((label) => label.name === nextLabelName)) {
              core.setFailed(`${nextLabelName} is not defined. Run the Labels workflow to sync .github/labels.json.`);
              return;
            }

            for (const label of currentLabels) {
              if (!managedLabelNames.has(label.name) || label.name === nextLabelName) continue;
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  name: label.name,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
            if (!currentLabels.some((label) => label.name === nextLabelName)) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: [nextLabelName],
              });
            }

            const classification =
              nonTestChangedLines === 0
                ? testChangedLines > 0 ? "test-only PR" : "no line changes"
                : testChangedLines > 0 ? "test lines excluded" : "all non-test changes";
            core.info(
              `PR #${issueNumber}: ${nonTestChangedLines} non-test lines, ${testChangedLines} test lines, ${changedLines} effective lines -> ${nextLabelName} (${classification})`,
            );

  collect-vouch-targets:
    name: Collect PR targets
    # Most comments are not recheck commands; skip them before a runner starts.
    if: >-
      github.event_name == 'pull_request_target' || github.event_name == 'push' ||
      (github.event.issue.pull_request && contains(github.event.comment.body, '/recheck-vouch'))
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.collect.outputs.targets }}
    steps:
      - id: collect
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            if (context.eventName === "pull_request_target") {
              const pr = context.payload.pull_request;
              core.setOutput("targets", JSON.stringify([{ number: pr.number, user: pr.user.login }]));
              return;
            }

            if (context.eventName === "issue_comment") {
              const issue = context.payload.issue;
              const body = context.payload.comment?.body ?? "";
              if (!issue?.pull_request || !body.includes("/recheck-vouch")) {
                core.setOutput("targets", "[]");
                return;
              }

              core.setOutput(
                "targets",
                JSON.stringify([{ number: issue.number, user: issue.user.login }]),
              );
              return;
            }

            const pulls = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });

            const targets = pulls.map((pull) => ({
              number: pull.number,
              user: pull.user.login,
            }));
            core.setOutput("targets", JSON.stringify(targets));

  vouch:
    name: Label PR ${{ matrix.target.number }}
    needs: collect-vouch-targets
    if: ${{ needs.collect-vouch-targets.outputs.targets != '[]' }}
    runs-on: ubuntu-24.04
    concurrency:
      group: pr-vouch-${{ matrix.target.number }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.collect-vouch-targets.outputs.targets) }}
    steps:
      - id: vouch
        name: Check PR author trust
        uses: mitchellh/vouch/action/check-user@d66fa29a64600490892131ad87597c30c91fcac4 # v1.5.0
        with:
          user: ${{ matrix.target.user }}
          allow-fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync PR labels
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ matrix.target.number }}
          VOUCH_STATUS: ${{ steps.vouch.outputs.status }}
        with:
          script: |
            const issueNumber = Number(process.env.PR_NUMBER);
            const status = process.env.VOUCH_STATUS;
            const managedLabels = [
              {
                name: "vouch:trusted",
                color: "1f883d",
                description: "PR author is trusted by repo permissions or the VOUCHED list.",
              },
              {
                name: "vouch:unvouched",
                color: "fbca04",
                description: "PR author is not yet trusted in the VOUCHED list.",
              },
              {
                name: "vouch:denounced",
                color: "d1242f",
                description: "PR author is explicitly blocked by the VOUCHED list.",
              },
            ];

            const managedLabelNames = new Set(managedLabels.map((label) => label.name));

            for (const label of managedLabels) {
              try {
                const { data: existing } = await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                });

                if (
                  existing.color !== label.color ||
                  (existing.description ?? "") !== label.description
                ) {
                  await github.rest.issues.updateLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: label.name,
                    color: label.color,
                    description: label.description,
                  });
                }
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }

                try {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: label.name,
                    color: label.color,
                    description: label.description,
                  });
                } catch (createError) {
                  if (createError.status !== 422) {
                    throw createError;
                  }
                }
              }
            }

            const nextLabelName =
              status === "denounced"
                ? "vouch:denounced"
                : ["bot", "collaborator", "vouched"].includes(status)
                  ? "vouch:trusted"
                  : "vouch:unvouched";

            const { data: currentLabels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100,
            });

            for (const label of currentLabels) {
              if (!managedLabelNames.has(label.name) || label.name === nextLabelName) {
                continue;
              }

              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  name: label.name,
                });
              } catch (removeError) {
                if (removeError.status !== 404) {
                  throw removeError;
                }
              }
            }

            if (!currentLabels.some((label) => label.name === nextLabelName)) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: [nextLabelName],
              });
            }

            core.info(`PR #${issueNumber}: ${status} -> ${nextLabelName}`);
