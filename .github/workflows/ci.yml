name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * *' # nightly: everything, on all three systems
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      node: ${{ steps.pick.outputs.node }}
      engine: ${{ steps.pick.outputs.engine }}
      animations: ${{ steps.pick.outputs.animations }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pick the jobs this change needs
        id: pick
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # Pushes to main, the nightly run and manual runs (gh workflow run CI --ref <branch>) run everything.
          if [ "$EVENT" != "pull_request" ]; then
            echo "Full run ($EVENT)"
            { echo node=true; echo engine=true; echo animations=true; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE...$HEAD")
          printf 'Changed files:\n%s\n' "$files"
          has() { printf '%s\n' "$files" | grep -E "$1" > /dev/null && echo true || echo false; }
          # This workflow itself: run everything.
          self='^\.github/workflows/ci\.yml$'
          # Node on three systems: the app and the AI editor, plus the engine (app/test/real-engine.test.ts runs it),
          # animation metadata (ai/ generates its list from it), packaging and the root package files.
          node=$(has "$self|^(app|ai|engine|packaging)/|^templates/animations/.*/meta\.json$|^package(-lock)?\.json$")
          engine=$(has "$self|^engine/|^packaging/(requirements[^/]*\.txt|hash_requirements\.py)$")
          animations=$(has "$self|^templates/")
          echo "node=$node engine=$engine animations=$animations"
          { echo "node=$node"; echo "engine=$engine"; echo "animations=$animations"; } >> "$GITHUB_OUTPUT"
  node:
    needs: changes
    if: needs.changes.outputs.node == 'true'
    name: Node / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update && for i in 1 2 3; do timeout 300 sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 -o Acquire::http::Timeout=30 ffmpeg && break; sudo dpkg --configure -a || true; sleep 10; done && command -v ffmpeg
      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        run: choco install ffmpeg --yes --no-progress
      - run: npm ci --no-audit --no-fund
      - run: npm run build -w ai
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w app
  engine:
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    name: Engine / Python 3.11
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      REELENGINE_NET_TESTS: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.11.15'
          python-version: '3.11'
          enable-cache: true
          cache-dependency-glob: |
            engine/requirements.txt
            packaging/requirements-extra.txt
            engine/pyproject.toml
      - run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update && for i in 1 2 3; do timeout 300 sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 -o Acquire::http::Timeout=30 ffmpeg && break; sudo dpkg --configure -a || true; sleep 10; done && command -v ffmpeg
      - run: uv run --no-project python packaging/hash_requirements.py --check
      - name: Install engine and test dependencies
        run: |
          uv venv --python 3.11 engine/.venv
          # CI encodes HEIC samples; the packaged app keeps decode-only pi-heif.
          uv pip install --python engine/.venv -c engine/requirements.txt -r packaging/requirements-extra.txt -e 'engine[dev]' 'pytest<10' pillow-heif
          # faster-whisper pulls in PyAV; the installers leave it out (engine/reelengine/nopyav.py), so test without it.
          uv pip uninstall --python engine/.venv av
      - name: Verify FFmpeg capabilities
        shell: bash
        run: |
          ffmpeg -hide_banner -filters > "$RUNNER_TEMP/ffmpeg-filters.txt"
          grep -w subtitles "$RUNNER_TEMP/ffmpeg-filters.txt"
          ffmpeg -hide_banner -encoders > "$RUNNER_TEMP/ffmpeg-encoders.txt"
          grep -w libx264 "$RUNNER_TEMP/ffmpeg-encoders.txt"
          ffprobe -version
      - run: uv run --no-project --python engine/.venv python -m pytest engine/tests -v -ra
        env:
          # runner.* is not available in a job-level env, only in a step's
          REELENGINE_CACHE: ${{ runner.temp }}/reelengine-cache
  animations:
    needs: changes
    if: needs.changes.outputs.animations == 'true'
    name: Animation rendering
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: templates/animations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: templates/animations/package-lock.json
      - run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update && for i in 1 2 3; do timeout 300 sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 -o Acquire::http::Timeout=30 ffmpeg && break; sudo dpkg --configure -a || true; sleep 10; done && command -v ffmpeg
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test
  ci-ok:
    # The one required check. A job this change didn't need is skipped, and skipped counts as passed;
    # a failed or cancelled one fails this.
    name: CI ok
    needs: [changes, node, engine, animations]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Every needed job passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -qE '"(failure|cancelled)"'; then exit 1; fi
