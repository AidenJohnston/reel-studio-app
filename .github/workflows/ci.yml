name: CI
on:
  pull_request:
  push:
    # redesign-beta: the fork's integration branch, which has no pull request to run on.
    # release/** and port/**: the 0.2.0 integration branch and the branches that port PRs onto it, so each push
    # gets the full matrix before a pull request exists.
    branches: [main, redesign-beta, 'release/**', 'port/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Gated jobs run unless this says 'false', so a failed detector never skips a check.
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      engine: ${{ steps.detect.outputs.engine }}
      animations: ${{ steps.detect.outputs.animations }}
      e2e: ${{ steps.detect.outputs.e2e }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 2 # the merge commit and its base parent
      - name: Detect affected jobs
        id: detect
        if: github.event_name == 'pull_request'
        run: node scripts/ci/changes.mjs --github

  node:
    name: Node / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      # The ai and app tests that run the real engine (variation, lint-edit, schema-parity, footage, footage-index)
      # start it with `uv run --with-editable ./engine[dev]`, so without uv they fail with `spawn uv ENOENT`.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.11.15'
          enable-cache: true
          cache-dependency-glob: |
            engine/requirements.txt
            engine/pyproject.toml
      - name: Cache Electron download
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update && for i in 1 2 3; do timeout 300 sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 -o Acquire::http::Timeout=30 ffmpeg && break; sudo dpkg --configure -a || true; sleep 10; done && command -v ffmpeg
      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        run: choco install ffmpeg --yes --no-progress
      - run: npm ci --no-audit --no-fund
      - run: npm run build -w ai
      - run: npm run typecheck
      # Builds that engine environment once, so its first download (faster-whisper, OpenCV) does not count against
      # the timeout of whichever test happens to start the engine first.
      - name: Prepare the engine environment the tests start
        shell: bash
        run: uv run --no-project --python 3.11 --with-editable './engine[dev]' python -c 'import reelengine'
      - run: npm test
      # The git and agent hooks run on contributors' machines, so they are tested on all three systems.
      - name: Leak check hook tests
        run: python scripts/leak-check/test_leak_check.py
      - run: npm run build -w app

  engine:
    name: Engine / Python 3.11
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.engine != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      REELENGINE_NET_TESTS: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.11.15'
          python-version: '3.11'
          enable-cache: true
          cache-dependency-glob: |
            engine/requirements.txt
            packaging/requirements-extra.txt
            engine/pyproject.toml
      - run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update && for i in 1 2 3; do timeout 300 sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 -o Acquire::http::Timeout=30 ffmpeg && break; sudo dpkg --configure -a || true; sleep 10; done && command -v ffmpeg
      - run: uv run --no-project python packaging/hash_requirements.py --check
      - name: Install engine and test dependencies
        run: |
          uv venv --python 3.11 engine/.venv
          # CI encodes HEIC samples; the packaged app keeps decode-only pi-heif.
          uv pip install --python engine/.venv -c engine/requirements.txt -r packaging/requirements-extra.txt -e 'engine[dev,reference]' 'pytest<10' pillow-heif
          # faster-whisper pulls in PyAV; the installers leave it out (engine/reelengine/nopyav.py), so test without it.
          uv pip uninstall --python engine/.venv av
      - name: Verify FFmpeg capabilities
        shell: bash
        run: |
          ffmpeg -hide_banner -filters > "$RUNNER_TEMP/ffmpeg-filters.txt"
          grep -w subtitles "$RUNNER_TEMP/ffmpeg-filters.txt"
          ffmpeg -hide_banner -encoders > "$RUNNER_TEMP/ffmpeg-encoders.txt"
          grep -w libx264 "$RUNNER_TEMP/ffmpeg-encoders.txt"
          ffprobe -version
      - run: uv run --no-project --python engine/.venv python -m pytest engine/tests -v -ra
        env:
          # runner.* is not available in a job-level env, only in a step's
          REELENGINE_CACHE: ${{ runner.temp }}/reelengine-cache

  animations:
    name: Animation rendering
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.animations != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: templates/animations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: templates/animations/package-lock.json
      - run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update && for i in 1 2 3; do timeout 300 sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 -o Acquire::http::Timeout=30 ffmpeg && break; sudo dpkg --configure -a || true; sleep 10; done && command -v ffmpeg
      - run: npm ci --no-audit --no-fund
      - name: Cache Chromium
        id: chromium
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('templates/animations/package-lock.json') }}
      - name: Install Chromium
        if: steps.chromium.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium's system libraries
        if: steps.chromium.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm test

  e2e:
    name: E2E / shard ${{ matrix.shard }} of 8
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.e2e != 'false' }}
    runs-on: ubuntu-24.04
    # Specs run one at a time with a 300 s timeout each. Eight shards is a first guess, to be set from measured wall times.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      # The stand-in engine (app/dev/fake-engine) is stdlib-only Python; the app runs it with python3 from PATH.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.11.15'
      - name: Cache Electron download
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Install FFmpeg and Xvfb
        run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update && for i in 1 2 3; do timeout 300 sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 -o Acquire::http::Timeout=30 ffmpeg xvfb xauth && break; sudo dpkg --configure -a || true; sleep 10; done && command -v ffmpeg && command -v xvfb-run
      # Ubuntu 24.04's AppArmor blocks the unprivileged user namespaces Chromium's sandbox needs, and npm leaves
      # Electron's chrome-sandbox without its setuid bit, so Electron aborts at launch. This lets the sandbox start
      # instead of turning it off in the app.
      - name: Allow Electron's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm ci --no-audit --no-fund
      - run: npm run build -w ai
      - name: Run shard ${{ matrix.shard }} of 8
        run: xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' npm run e2e -w app -- --shard=${{ matrix.shard }}/8
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report-shard-${{ matrix.shard }}
          path: |
            app/playwright-report/
            app/test-results/
          retention-days: 14
          if-no-files-found: ignore

  ci-ok:
    name: CI ok
    needs: [changes, node, engine, animations, e2e]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Every needed job passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -qE '"(failure|cancelled)"'; then exit 1; fi
