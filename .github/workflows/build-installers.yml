name: Build installers

# Unsigned Windows and macOS installers, checked by running the bundled engine. Signing and publishing to
# dl.getreelstudio.com stay manual (packaging/README.md).
on:
  workflow_call:
    inputs:
      label:
        description: Name for the artifacts, such as v0.1.5 or 0.1.5-nightly.20261112.abc1234.
        required: true
        type: string
      ref:
        description: Commit, branch or tag to build. Empty builds the triggering commit.
        required: false
        type: string
        default: ''
      retention-days:
        required: false
        type: number
        default: 14
  # By hand on any branch, such as release/0.2.0: gh workflow run build-installers.yml --ref release/0.2.0
  workflow_dispatch:
    inputs:
      label:
        description: Name for the artifacts. Empty names them after the run and commit.
        required: false
        type: string
        default: ''
      ref:
        description: Commit, branch or tag to build. Empty builds the branch this runs on.
        required: false
        type: string
        default: ''
      retention-days:
        required: false
        type: number
        default: 14
      update-host:
        description: The server the build updates from (packaging/make-config.js RS_UPDATE_HOST).
        required: false
        type: choice
        options: [dl.getreelstudio.com, dl-staging.getreelstudio.com]
        default: dl.getreelstudio.com
  # A change to this workflow or the bundle check builds once, so it is proven before it is used. GitHub can only
  # start a workflow by hand once it has run, and main does not have this file yet.
  push:
    branches: ['release/**', 'port/**']
    paths:
      - .github/workflows/build-installers.yml
      - scripts/ci/check-bundle.py
      - scripts/ci/check-update-channel.ps1

permissions:
  contents: read

jobs:
  build:
    name: Installer / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # macOS compiles OpenCV without FFmpeg (#169, packaging/build_opencv_mac.py) when no cached wheel matches; that
    # build gets the same 240 minutes as .github/workflows/opencv-mac.yml. A cached wheel makes it minutes again.
    timeout-minutes: ${{ matrix.os == 'macos-15' && 240 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            resources: app/release/win-unpacked/resources
          - os: macos-15
            resources: app/release/mac-arm64/Reel Studio.app/Contents/Resources
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      # The same cache as opencv-mac.yml: only the finished wheel and its build record, which build_opencv_mac.py
      # checks against the record again before using it.
      - name: Cache key of the macOS OpenCV build
        if: runner.os == 'macOS'
        id: opencv
        working-directory: packaging
        run: |
          key=$(python3 -c 'import build_opencv_mac as b; print(b.cache_key())')
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "dir=packaging/cache/opencv/${key:0:16}" >> "$GITHUB_OUTPUT"
      - if: runner.os == 'macOS'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.opencv.outputs.dir }}
          key: opencv-mac-arm64-${{ steps.opencv.outputs.key }}
      - name: Build the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RS_UPDATE_HOST: ${{ inputs.update-host }}
        run: ./packaging/build-win.ps1
      - name: Build the macOS installer
        if: runner.os == 'macOS'
        env:
          RS_UPDATE_HOST: ${{ inputs.update-host }}
        run: bash packaging/build-mac.sh
      # A Windows copy tells a staging installer from a production one by its FileDescription (app updater-electron.ts
      # installerRefusal): this reads what the built installer really carries.
      - name: Check the update server the Windows installer names
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RS_UPDATE_HOST: ${{ inputs.update-host }}
        run: ./scripts/ci/check-update-channel.ps1
      - name: Check the bundled engine
        run: python scripts/ci/check-bundle.py "${{ matrix.resources }}"
      - name: Checksums
        shell: bash
        run: |
          cd app/release
          files=$(ls *.exe *.dmg signed/*.dmg 2>/dev/null || true)
          test -n "$files"
          if command -v sha256sum >/dev/null; then sha256sum $files; else shasum -a 256 $files; fi | tee "SHA256SUMS-${{ runner.os }}.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reel-studio-${{ inputs.label || format('run{0}-{1}', github.run_number, github.sha) }}-${{ runner.os }}
          path: |
            app/release/*.exe
            app/release/*.dmg
            app/release/signed/*.dmg
            app/release/SHA256SUMS-*.txt
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days || 14 }}
