name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  title:
    name: PR title
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check the title format
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Never print the title: the runner reads "::" and "##[" in output as commands.
          types='feat|fix|perf|refactor|docs|test|build|ci|chore|revert'
          # [[:space:]] misses Unicode spaces.
          if [[ "$TITLE" != *$'\n'* && "$TITLE" != *$'\r'* ]] &&
            ! printf '%s' "$TITLE" | LC_ALL=C.UTF-8 grep -qP '[\x{00A0}\x{1680}\x{2000}-\x{200B}\x{2028}\x{2029}\x{202F}\x{205F}\x{3000}\x{FEFF}]' &&
            printf '%s' "$TITLE" | grep -Eq "^($types)(\([a-z0-9][a-z0-9/-]*\))?!?: ([^[:space:].]|[^[:space:]].*[^[:space:].])$"; then
            echo "The title is type(scope): subject."
            exit 0
          fi
          echo "::error::The title must be one line, 'type(scope): subject', where type is one of ${types//|/, }; the scope is optional and lowercase; the subject doesn't end with a period or a space, and has no special spaces. Example: 'fix(captions): keep subtitles clear of the buttons'."
          exit 1
