name: PR labels
on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: pr-labels
  cancel-in-progress: false
  queue: max
jobs:
  label:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Never check out or execute PR code with this write token.
      - uses: actions/github-script@v8
        with:
          script: |
            const repo = context.repo;
            const number = context.payload.pull_request.number;
            const { data: pr } = await github.rest.pulls.get({ ...repo, pull_number: number });
            const read = async path => {
              const { data } = await github.rest.repos.getContent({ ...repo, path, ref: context.payload.repository.default_branch });
              return Buffer.from(data.content, 'base64').toString('utf8');
            };
            const trusted = (await read('.github/VOUCHED.td')).trim().toLowerCase().split(/\r?\n/);
            const labels = JSON.parse(await read('.github/labels.json'));
            const sizes = ['XS', 'S', 'M', 'L', 'XL', 'XXL'];
            const lines = pr.additions + pr.deletions;
            const index = [10, 30, 100, 500, 1000, Infinity].findIndex(limit => lines < limit);
            const wanted = [
              labels.find(label => label.name === `size:${sizes[index]}`),
              trusted.includes(`github:${pr.user?.login.toLowerCase()}`)
                ? labels.find(label => label.name === 'vouch:trusted')
                : labels.find(label => label.name === 'vouch:unvouched')
            ];
            const defined = await github.paginate(github.rest.issues.listLabelsForRepo, { ...repo, per_page: 100 });
            for (const label of wanted) {
              if (!label) throw new Error('Missing label definition');
              if (!defined.some(current => current.name === label.name)) {
                await github.rest.issues.createLabel({ ...repo, ...label });
              }
            }
            const managed = [...sizes.map(size => `size:${size}`), 'vouch:trusted', 'vouch:unvouched'];
            const current = await github.paginate(github.rest.issues.listLabelsOnIssue, {
              ...repo, issue_number: number, per_page: 100
            });
            for (const label of current) {
              if (managed.includes(label.name) && !wanted.some(next => next.name === label.name)) {
                await github.rest.issues.removeLabel({ ...repo, issue_number: number, name: label.name });
              }
            }
            await github.rest.issues.addLabels({ ...repo, issue_number: number, labels: wanted.map(label => label.name) });
