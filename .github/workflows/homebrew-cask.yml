name: Homebrew cask

# Points Casks/reel-studio.rb at a newly published release so `brew upgrade` picks it up.
# Pre-releases are skipped. If the DMG was uploaded after publishing, rerun this by hand with the tag.
on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.1.3
        required: true

permissions:
  contents: write

concurrency:
  group: homebrew-cask

jobs:
  bump:
    name: Bump cask
    if: startsWith(github.event.release.tag_name || inputs.tag, 'v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Write the release version and DMG checksum into the cask
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $TAG is not vMAJOR.MINOR.PATCH"
            exit 1
          fi
          version="${TAG#v}"
          dmg="Reel-Studio-${version}-arm64.dmg"
          # GitHub records a sha256 digest for every release asset, so the 300 MB DMG is not downloaded.
          digest=$(gh release view "$TAG" --json assets --jq ".assets[] | select(.name == \"$dmg\") | .digest")
          if [[ "$digest" != sha256:* ]]; then
            echo "::error::Release $TAG has no $dmg asset with a sha256 digest"
            exit 1
          fi
          sed -i -E \
            -e "s/^  version \".*\"$/  version \"${version}\"/" \
            -e "s/^  sha256 \".*\"$/  sha256 \"${digest#sha256:}\"/" \
            Casks/reel-studio.rb
          if ! grep -q "^  version \"${version}\"$" Casks/reel-studio.rb || ! grep -q "^  sha256 \"${digest#sha256:}\"$" Casks/reel-studio.rb; then
            echo "::error::Casks/reel-studio.rb no longer has the version and sha256 lines this workflow rewrites"
            exit 1
          fi
          if git diff --quiet; then
            echo "Cask already points at $version"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Homebrew cask: Reel Studio ${version}"
          git push origin HEAD:main
