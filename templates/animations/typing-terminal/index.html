<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../_lib/base.css">
<style>
  .win {
    width: var(--maxw); background: var(--card); color: var(--ink);
    border-radius: calc(var(--k) * 30px); overflow: hidden;
    box-shadow: 0 calc(var(--k) * 18px) calc(var(--k) * 54px) rgba(0,0,0,0.34), 0 0 0 calc(var(--k) * 2px) var(--line);
  }
  .bar { display: flex; align-items: center; gap: calc(var(--k) * 14px); padding: calc(var(--k) * 24px) calc(var(--k) * 30px); border-bottom: calc(var(--k) * 2px) solid var(--line); }
  .bar i { width: calc(var(--k) * 22px); height: calc(var(--k) * 22px); border-radius: 50%; display: block; }
  .bar i:nth-child(1) { background: #FF5F57; } .bar i:nth-child(2) { background: #FEBC2E; } .bar i:nth-child(3) { background: #28C840; }
  .bar span { margin-left: calc(var(--k) * 14px); font-weight: 600; color: var(--muted); font-size: calc(var(--k) * 40px); }
  .body { padding: calc(var(--k) * 34px) calc(var(--k) * 40px) calc(var(--k) * 42px); }
  .mono { font-family: "JetBrains Mono"; font-weight: 700; font-size: calc(var(--k) * 64px); line-height: 1.32; letter-spacing: -0.01em; white-space: pre-wrap; word-break: break-word; }
  .prompt { color: var(--hl); }
  .rest { visibility: hidden; }
  .caret { position: relative; display: inline-block; width: 0; }
  .caret b { position: absolute; left: 0; top: -0.92em; width: 0.58em; height: 1.08em; background: var(--hl); display: block; }
  .out { font-family: "JetBrains Mono"; font-weight: 500; color: var(--muted); font-size: calc(var(--k) * 54px); line-height: 1.32; margin-top: calc(var(--k) * 18px); white-space: pre-wrap; }

  /* chat: a message being typed into a bubble, optional reply bubble */
  .chat { width: var(--maxw); display: flex; flex-direction: column; gap: calc(var(--k) * 22px); }
  .bubble {
    max-width: 86%; padding: calc(var(--k) * 30px) calc(var(--k) * 42px);
    border-radius: calc(var(--k) * 50px); font-weight: 600; font-size: calc(var(--k) * 70px); line-height: 1.2;
    box-shadow: 0 calc(var(--k) * 14px) calc(var(--k) * 40px) rgba(0,0,0,0.3); white-space: pre-wrap; word-break: break-word;
  }
  .me { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: calc(var(--k) * 12px); }
  .me .caret b { background: var(--accent-ink); width: 0.09em; }
  .them { align-self: flex-start; background: var(--card); color: var(--ink); border-bottom-left-radius: calc(var(--k) * 12px); }
  body.layout-full .win, body.layout-full .bubble { box-shadow: none; }
</style>
</head>
<body>
<div id="stage"><div id="content"></div></div>
<script src="../_lib/runtime.js"></script>
<script>
  // Per-character times: an even rhythm with a small fixed variation (a hash of the index, not random).
  function charTimes(n, start, cps) {
    const out = []; let t = start;
    for (let i = 0; i < n; i++) {
      out.push(t);
      const h = Math.abs(Math.sin((i + 1) * 12.9898) * 43758.5453) % 1;
      t += (0.7 + 0.6 * h) / cps;
    }
    return { times: out, end: t };
  }
  function speed(p, n) {
    if (Number(p.cps) > 0) return RS.clamp(Number(p.cps), 6, 120);
    return RS.clamp(n / 1.6, 18, 45); // a typical line finishes in ~1.6 s, never slower than 18 chars/s
  }
  RS.define({
    fonts: ['700 64px "JetBrains Mono"', '500 54px "JetBrains Mono"', '600 70px Inter'],
    tilt: 0,
    maxKFull: 1.3,
    duration(p) {
      const chars = Array.from(String(p.text || ''));
      const { end } = charTimes(chars.length, Number(p.typeAt) >= 0 ? Number(p.typeAt) : 0.2, speed(p, chars.length));
      return Math.max(2.5, Math.min(12, end + (p.response ? 1.8 : 1.2)));
    },
    enterAt: (p, ctx) => RS.firstBeat(ctx.times),
    build(p, ctx) {
      const chat = p.style === 'chat';
      ctx.chars = Array.from(String(p.text || ''));
      const sp = speed(p, ctx.chars.length);
      const ct = charTimes(ctx.chars.length, Number(p.typeAt) >= 0 ? Number(p.typeAt) : 0.2, sp);
      ctx.times = ct.times; ctx.typedEnd = ct.end;
      const line = `<span id="typed"></span><span class="caret"><b id="caret"></b></span><span class="rest" id="rest"></span>`;
      if (chat) {
        ctx.content.innerHTML = `<div class="chat">
            <div class="bubble me" id="box">${line}</div>
            ${p.response ? `<div class="bubble them" id="out">${RS.escapeHtml(p.response)}</div>` : ''}
          </div>`;
      } else {
        const prompt = p.prompt === undefined || p.prompt === null ? '> ' : String(p.prompt);
        ctx.content.innerHTML = `<div class="win" id="box">
            <div class="bar"><i></i><i></i><i></i>${p.title ? `<span>${RS.escapeHtml(p.title)}</span>` : ''}</div>
            <div class="body"><div class="mono"><span class="prompt">${RS.escapeHtml(prompt)}</span>${line}</div>
            ${p.response ? `<div class="out" id="out">${RS.escapeHtml(p.response)}</div>` : ''}</div>
          </div>`;
      }
      ctx.typed = document.getElementById('typed');
      ctx.rest = document.getElementById('rest');
      ctx.caret = document.getElementById('caret');
      ctx.box = document.getElementById('box');
      ctx.out = document.getElementById('out');
      // final state for measuring: all text typed
      ctx.typed.textContent = ctx.chars.join('');
      ctx.rest.textContent = '';
    },
    seek(t, p, ctx) {
      // The box enters WITH its first character (typing may be timed to a word said later), so a chat
      // bubble or terminal never sits empty with only a caret.
      RS.applyPop(ctx.box, RS.pop(t, ctx.enter, { dur: 0.2, from: 0.92 }));
      let n = 0;
      while (n < ctx.times.length && ctx.times[n] <= t) n++;
      ctx.typed.textContent = ctx.chars.slice(0, n).join('');
      ctx.rest.textContent = ctx.chars.slice(n).join('');
      const typing = t < ctx.typedEnd;
      const respAt = ctx.typedEnd + 0.3;
      // solid while typing, then a steady 1 s blink; hidden once the reply lands in chat mode
      const blinkOn = typing || Math.floor((t - ctx.typedEnd) / 0.5) % 2 === 0;
      const caretOn = blinkOn && !(p.style === 'chat' && p.response && t >= respAt);
      ctx.caret.style.opacity = caretOn ? '1' : '0';
      if (ctx.out) RS.applyPop(ctx.out, RS.pop(t, respAt, { dur: 0.2, from: 1, dy: 18 }));
    },
  });
</script>
</body>
</html>
