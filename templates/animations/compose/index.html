<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../_lib/base.css">
<style>
  /* Quieter chrome than the single-purpose cards: the parts carry the graphic, not the box. */
  .card {
    border-radius: calc(var(--k) * 24px);
    padding: calc(var(--k) * 40px) calc(var(--k) * 52px);
    box-shadow: 0 calc(var(--k) * 12px) calc(var(--k) * 36px) rgba(0, 0, 0, 0.22), 0 1px 3px rgba(0, 0, 0, 0.14);
  }
  body.face-sans { font-family: "Inter", sans-serif; }
  body.face-serif { font-family: "Fraunces", serif; }
  body.face-mono { font-family: "JetBrains Mono", monospace; }
  .rows { display: flex; flex-direction: column; gap: calc(var(--k) * 18px); }
  body.align-center .rows { align-items: center; }
  .row { display: flex; flex-wrap: nowrap; align-items: center; gap: calc(var(--k) * 22px); white-space: nowrap; }
  .part { position: relative; line-height: 1.02; }
  .t-hero { font-size: calc(var(--k) * 190px); font-weight: 700; letter-spacing: -0.03em; }
  .t-large { font-size: calc(var(--k) * 112px); font-weight: 700; letter-spacing: -0.02em; }
  .t-body { font-size: calc(var(--k) * 68px); font-weight: 600; letter-spacing: -0.01em; }
  .t-small { font-size: calc(var(--k) * 40px); font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
  body.face-serif .t-body { font-weight: 600; }
  body.face-mono .t-body, body.face-mono .t-small { font-weight: 500; }
  .c-ink { color: var(--ink); }
  .c-muted { color: var(--muted); }
  .c-accent { color: var(--hl); }
  .num { display: inline-block; text-align: right; }
  .strike { position: absolute; left: -2%; right: -2%; top: 52%; height: calc(var(--k) * 6px); margin-top: calc(var(--k) * -3px);
            background: currentColor; border-radius: calc(var(--k) * 3px); clip-path: inset(0 100% 0 0); }
  .arrow svg, .stars svg { display: block; }
  .arrow { width: 0.9em; height: 0.5em; }
  .rule { flex: 1 1 auto; min-width: calc(var(--k) * 520px); height: calc(var(--k) * 4px); border-radius: calc(var(--k) * 2px); background: currentColor; }
  .stars { display: inline-block; position: relative; height: 0.78em; }
  .stars .fill { position: absolute; inset: 0; }
</style>
</head>
<body>
<div id="stage"><div id="content"></div></div>
<script src="../_lib/runtime.js"></script>
<script>
  // Defaults by kind (meta.json says the same in each field's description).
  const SIZE = { text: 'body', number: 'hero', stars: 'large', arrow: 'body', rule: 'body' };
  const COLOR = { arrow: 'muted', rule: 'muted' };
  const MOTION = { text: 'rise', number: 'count', stars: 'fill', arrow: 'draw', rule: 'draw' };
  // A motion each kind can take; any other is replaced by the kind's own (the AI tool refuses it before this).
  const ALLOWED = { text: ['rise', 'strike'], number: ['count', 'rise', 'pop', 'strike'], stars: ['fill', 'rise'], arrow: ['draw'], rule: ['draw'] };
  const MAX_PARTS = 12;
  const STEP = 0.3;           // a part with no time follows the previous one by this much

  /** "1,200" -> {prefix:'', value:1200, decimals:0, grouped:true, suffix:''}; "$1.5M" -> {'$', 1.5, 1, false, 'M'}. */
  function parseNumber(s) {
    const m = String(s).match(/^(\D*?)(\d{1,3}(?:,\d{3})+|\d+)(?:\.(\d+))?(.*)$/);
    if (!m) return null;
    const grouped = m[2].includes(',');
    const value = Number(m[2].replace(/,/g, '') + (m[3] ? '.' + m[3] : ''));
    return { prefix: m[1], value, decimals: m[3] ? m[3].length : 0, grouped, suffix: m[4] };
  }
  function formatNumber(n, f) {
    let s = n.toFixed(f.decimals);
    if (f.grouped) { const [i, d] = s.split('.'); s = i.replace(/\B(?=(\d{3})+(?!\d))/g, ',') + (d ? '.' + d : ''); }
    return f.prefix + s + f.suffix;
  }

  const STAR = 'M12 2.2l2.95 6.3 6.85.8-5.08 4.7 1.36 6.8L12 17.4l-6.08 3.4 1.36-6.8L2.2 9.3l6.85-.8z';
  function starsSvg(n, fill) {
    const w = 24 * n + 6 * (n - 1);
    const paths = Array.from({ length: n }, (_, i) =>
      `<path transform="translate(${i * 30} 0)" d="${STAR}" ${fill ? 'fill="currentColor"' : 'fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"'}/>`).join('');
    return `<svg viewBox="0 0 ${w} 24" height="100%" style="height:100%;width:auto">${paths}</svg>`;
  }
  const ARROW = '<svg viewBox="0 0 90 50" width="100%" height="100%"><path d="M4 25H80M60 7l20 18-20 18" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  /** Each part's entrance time in reading order: its own `at`, else STEP after the previous part. */
  function times(rows) {
    const out = [];
    let prev = -STEP;
    for (const row of rows) for (const part of row.parts || []) {
      const at = Number(part.at);
      prev = Number.isFinite(at) && at >= 0 ? at : prev + STEP;
      out.push(prev);
    }
    return out;
  }

  RS.define({
    fonts: ['700 60px Inter', '600 60px Inter', '700 66px Fraunces', '600 66px Fraunces', '700 60px "JetBrains Mono"', '500 60px "JetBrains Mono"'],
    tilt: 0,
    duration(p) {
      const t = times(p.rows || []);
      return Math.max(3, Math.min(12, (t[t.length - 1] || 0) + 1.8));
    },
    enterAt: (p, ctx) => RS.firstBeat(ctx.times),
    build(p, ctx) {
      document.body.classList.add('face-' + (['serif', 'mono'].includes(p.face) ? p.face : 'sans'), 'align-' + (p.align === 'center' ? 'center' : 'start'));
      const rows = (p.rows || []).slice(0, 5).map((r) => ({ parts: (r.parts || []).slice(0, 5) }));
      let budget = MAX_PARTS;
      for (const r of rows) { r.parts = r.parts.slice(0, Math.max(0, budget)); budget -= r.parts.length; }
      ctx.times = times(rows);
      ctx.parts = [];
      const html = rows.map((row, ri) => `<div class="row">${row.parts.map((part, pi) => {
        const kind = SIZE[part.kind] ? part.kind : 'text';
        const size = ['hero', 'large', 'body', 'small'].includes(part.size) ? part.size : SIZE[kind];
        const color = ['ink', 'muted', 'accent'].includes(part.color) ? part.color : (COLOR[kind] || 'ink');
        const motion = (ALLOWED[kind] || []).includes(part.motion) ? part.motion : MOTION[kind];
        const id = `p${ri}-${pi}`;
        let inner = '';
        if (kind === 'number') {
          inner = `<span class="num" id="${id}-n">${RS.escapeHtml(part.text)}</span>`;
        } else if (kind === 'stars') {
          const max = Math.max(1, Math.min(10, Math.round(Number(part.max) || 5)));
          inner = `<span class="stars" id="${id}-s"><span class="c-muted">${starsSvg(max, false)}</span><span class="fill">${starsSvg(max, true)}</span></span>`;
          ctx.parts.push({ id, kind, motion, fillTo: Math.max(0, Math.min(1, (Number(part.value) || 0) / max)) });
        } else if (kind === 'arrow') {
          inner = ARROW;
        } else if (kind === 'text') {
          inner = RS.escapeHtml(part.text);
        }
        if (kind !== 'stars') ctx.parts.push({ id, kind, motion, text: part.text });
        const strike = motion === 'strike' ? `<span class="strike" id="${id}-x"></span>` : '';
        return `<div class="part ${kind} t-${size} c-${color}" id="${id}" data-row="${ri}">${inner}${strike}</div>`;
      }).join('')}</div>`).join('');
      ctx.content.innerHTML = `<div class="card" id="card"><div class="rows">${html}</div></div>`;
      ctx.card = document.getElementById('card');
      ctx.parts.forEach((pt, i) => {
        pt.el = document.getElementById(pt.id);
        pt.at = ctx.times[i];
        pt.row = Number(pt.el.dataset.row);
        if (pt.kind === 'stars') pt.fill = pt.el.querySelector('.fill');
        if (pt.motion === 'strike') pt.bar = document.getElementById(pt.id + '-x');
      });
      // a strike draws when the next part in its row lands (the new value replacing the old)
      ctx.parts.forEach((pt, i) => {
        const next = ctx.parts.slice(i + 1).find((q) => q.row === pt.row && q.kind !== 'arrow');
        pt.strikeAt = (next ? next.at : pt.at + 0.6) + 0.05;
      });
      // a count starts from the previous number in its row (the old value), else from zero
      ctx.parts.forEach((pt, i) => {
        if (pt.kind !== 'number') return;
        pt.num = document.getElementById(pt.id + '-n');
        pt.fmt = parseNumber(pt.text);
        if (!pt.fmt) { pt.motion = pt.motion === 'count' ? 'rise' : pt.motion; return; }
        const prev = ctx.parts.slice(0, i).reverse().find((q) => q.row === pt.row && q.kind === 'number' && q.fmt);
        pt.from = prev ? prev.fmt.value : 0;
      });
    },
    afterFit(p, ctx) {
      // a counting number keeps its final width, so the row never shifts while it counts
      for (const pt of ctx.parts) if (pt.kind === 'number' && pt.num) pt.num.style.minWidth = pt.num.getBoundingClientRect().width / (ctx.push || 1) + 'px';
    },
    seek(t, p, ctx) {
      RS.applyPop(ctx.card, RS.pop(t, ctx.enter, { dur: 0.2, from: 0.96, overshoot: 1.08 }));
      for (const pt of ctx.parts) {
        const { el, at } = pt;
        if (pt.kind === 'arrow' || pt.kind === 'rule') {
          el.style.opacity = t < at ? '0' : '1';
          const q = RS.ease.outCubic(RS.prog(t, at, 0.25));
          el.style.clipPath = `inset(0 ${(100 * (1 - q)).toFixed(2)}% 0 0)`;
          continue;
        }
        if (pt.motion === 'pop') RS.applyPop(el, RS.pop(t, at, { dur: 0.24, from: 0.92, overshoot: 1.08 }));
        else RS.applyPop(el, RS.pop(t, at, { dur: 0.22, from: 1, dy: 24 }));
        if (pt.kind === 'number' && pt.fmt) {
          const q = pt.motion === 'count' ? RS.ease.outExpo(RS.prog(t, at, 0.7)) : 1;
          pt.num.textContent = formatNumber(RS.lerp(pt.from, pt.fmt.value, q), pt.fmt);
        }
        if (pt.kind === 'stars') {
          const q = pt.motion === 'fill' ? RS.ease.outCubic(RS.prog(t, at, 0.6)) : 1;
          pt.fill.style.clipPath = `inset(0 ${(100 * (1 - pt.fillTo * q)).toFixed(2)}% 0 0)`;
        }
        if (pt.bar) {
          const q = RS.ease.outCubic(RS.prog(t, pt.strikeAt, 0.18));
          pt.bar.style.clipPath = `inset(0 ${(100 * (1 - q)).toFixed(2)}% 0 0)`;
          el.classList.toggle('c-muted', q > 0);
        }
      }
    },
  });
</script>
</body>
</html>
